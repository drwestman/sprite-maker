name: Jules PR Review

on:
  pull_request_target:
    types: [opened]
  # This workflow must be present on the default branch for this event to run.
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Keep JULES_API_KEY out of untrusted comment and fork PR workflows. This
    # workflow deliberately does not check out or execute pull-request code.
    if: >-
      (
        (
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          github.event.comment.body == '@jules review' &&
          (
            github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'MEMBER' ||
            github.event.comment.author_association == 'COLLABORATOR'
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 32

    steps:
      - name: Resolve pull request context
        id: resolve_context
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_PR_URL: ${{ github.event.pull_request.html_url }}
          EVENT_PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = 'pull_request_target' ]; then
            pr_number="$EVENT_PR_NUMBER"
            pr_url="$EVENT_PR_URL"
            base_ref="$EVENT_PR_BASE_REF"
            base_sha="$EVENT_PR_BASE_SHA"
            head_ref="$EVENT_PR_HEAD_REF"
            head_sha="$EVENT_PR_HEAD_SHA"
          else
            pr_number="$EVENT_ISSUE_NUMBER"
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --output "$RUNNER_TEMP/pull-request.json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$pr_number"

            state="$(jq --raw-output '.state // empty' "$RUNNER_TEMP/pull-request.json")"
            head_repo="$(jq --raw-output '.head.repo.full_name // empty' "$RUNNER_TEMP/pull-request.json")"
            if [ "$state" != 'open' ] || [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
              echo 'Only open pull requests from this repository may be reviewed.' >&2
              exit 1
            fi

            pr_url="$(jq --raw-output '.html_url // empty' "$RUNNER_TEMP/pull-request.json")"
            base_ref="$(jq --raw-output '.base.ref // empty' "$RUNNER_TEMP/pull-request.json")"
            base_sha="$(jq --raw-output '.base.sha // empty' "$RUNNER_TEMP/pull-request.json")"
            head_ref="$(jq --raw-output '.head.ref // empty' "$RUNNER_TEMP/pull-request.json")"
            head_sha="$(jq --raw-output '.head.sha // empty' "$RUNNER_TEMP/pull-request.json")"
          fi

          test -n "$pr_number"
          test -n "$pr_url"
          test -n "$base_ref"
          test -n "$base_sha"
          test -n "$head_ref"
          test -n "$head_sha"

          {
            printf 'pr_number=%s\n' "$pr_number"
            printf 'pr_url=%s\n' "$pr_url"
            printf 'base_ref=%s\n' "$base_ref"
            printf 'base_sha=%s\n' "$base_sha"
            printf 'head_ref=%s\n' "$head_ref"
            printf 'head_sha=%s\n' "$head_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Create Jules review session
        id: create_session
        if: steps.resolve_context.outcome == 'success'
        continue-on-error: true
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          PR_NUMBER: ${{ steps.resolve_context.outputs.pr_number }}
          PR_URL: ${{ steps.resolve_context.outputs.pr_url }}
          PR_BASE_REF: ${{ steps.resolve_context.outputs.base_ref }}
          PR_BASE_SHA: ${{ steps.resolve_context.outputs.base_sha }}
          PR_HEAD_REF: ${{ steps.resolve_context.outputs.head_ref }}
          PR_HEAD_SHA: ${{ steps.resolve_context.outputs.head_sha }}
        run: |
          set -euo pipefail

          prompt_file="$RUNNER_TEMP/jules-pr-review-prompt.md"
          cat > "$prompt_file" <<'PROMPT'
          Review the pull request described below. Review only: do not modify files,
          create commits, open a pull request, or propose an implementation plan.

          Evaluate the pull request diff against these requirements:
          - SOLID principles: identify violations of single responsibility, open/closed,
            Liskov substitution, interface segregation, or dependency inversion.
           - BDD techniques: changed behavior must be specified through clear,
             behavior-focused Given/When/Then-style tests. Flag missing or weak test
             coverage for important behavior and edge cases.
            - Apply CQRS checks when diffs touch read/write responsibilities, state
              mutation, handlers, repositories, or related interfaces.
              Queries must not cause externally observable business-state mutations;
              incidental telemetry, tracing/logging, and safe caching are allowed.
           - Commands should express mutation intent and avoid inappropriate coupling to
             query/read-model concerns. IDs/status/versions and other necessary operation
             results are allowed; flag returns only for concrete coupling, consistency, or correctness risks.
           - Flag query paths that invoke mutation-capable behavior, while allowing shared
             pure domain services. If async commands/events or separate read models are
             introduced, review idempotency, retries/failure handling, and
             eventual-consistency assumptions.
           - Do not require CQRS infrastructure, separate databases, event buses, read
             models, or broad refactors absent a concrete PR-introduced impact.
           - Correctness, security, financial/trading safety, performance,
             maintainability, and the repository's existing conventions.

          Inspect the diff between the supplied base and head commits. Report only
          actionable findings introduced by this pull request; do not invent issues or
          restate style preferences without a concrete impact. Use English. Do not use
          GitHub mentions.

          Your final agent message must begin exactly with
          <!-- JULES_PR_REVIEW -->
          and contain one Markdown report organized as Critical, Important, and
          Suggestion. For each finding, include the file and line or symbol, the impact,
          and a concise suggested fix. If no actionable findings exist, explicitly state
          that in the report.
          PROMPT

          {
            printf '\nPull request: %s\n' "$PR_URL"
            printf 'Pull request number: %s\n' "$PR_NUMBER"
            printf 'Base ref and commit: %s @ %s\n' "$PR_BASE_REF" "$PR_BASE_SHA"
            printf 'Head ref and commit: %s @ %s\n' "$PR_HEAD_REF" "$PR_HEAD_SHA"
          } >> "$prompt_file"

          jq -n \
            --rawfile prompt "$prompt_file" \
            --arg source "sources/github/$GITHUB_REPOSITORY" \
            --arg starting_branch "$PR_HEAD_REF" \
            --arg title "Jules review for PR #$PR_NUMBER" \
            '{
              prompt: $prompt,
              title: $title,
              sourceContext: {
                source: $source,
                githubRepoContext: {startingBranch: $starting_branch}
              },
              requirePlanApproval: false
            }' > "$RUNNER_TEMP/jules-session-request.json"

          curl --fail-with-body --silent --show-error \
            --header 'Content-Type: application/json' \
            --header "X-Goog-Api-Key: $JULES_API_KEY" \
            --data @"$RUNNER_TEMP/jules-session-request.json" \
            --output "$RUNNER_TEMP/jules-session.json" \
            'https://jules.googleapis.com/v1alpha/sessions'

          session_name="$(jq --raw-output '.name // empty' "$RUNNER_TEMP/jules-session.json")"
          session_url="$(jq --raw-output '.url // empty' "$RUNNER_TEMP/jules-session.json")"
          test -n "$session_name"
          printf 'session_name=%s\n' "$session_name" >> "$GITHUB_OUTPUT"
          printf 'session_url=%s\n' "$session_url" >> "$GITHUB_OUTPUT"

      - name: Post Jules session link
        if: steps.create_session.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.resolve_context.outputs.pr_number }}
          SESSION_URL: ${{ steps.create_session.outputs.session_url }}
        run: |
          set -euo pipefail

          marker='<!-- JULES_SESSION_LINK -->'
          body="$marker
          Jules review started: $SESSION_URL"
          jq -n --arg body "$body" '{body: $body}' > "$RUNNER_TEMP/jules-session-comment.json"

          existing_comment_id="$(
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            | jq --raw-output \
              '[.[] | select(.body | startswith("<!-- JULES_SESSION_LINK -->"))] | last | .id // empty'
          )"

          if [ -n "$existing_comment_id" ]; then
            curl --fail-with-body --silent --show-error \
              --request PATCH \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --data @"$RUNNER_TEMP/jules-session-comment.json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/comments/$existing_comment_id"
          else
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --data @"$RUNNER_TEMP/jules-session-comment.json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"
          fi

      - name: Wait for Jules review
        id: wait_for_review
        if: steps.create_session.outcome == 'success'
        continue-on-error: true
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          SESSION_NAME: ${{ steps.create_session.outputs.session_name }}
        run: |
          set -euo pipefail

          session_id="${SESSION_NAME#sessions/}"
          for attempt in $(seq 1 100); do
            curl --fail-with-body --silent --show-error \
              --header "X-Goog-Api-Key: $JULES_API_KEY" \
              --output "$RUNNER_TEMP/jules-session-status.json" \
              "https://jules.googleapis.com/v1alpha/sessions/$session_id"

            state="$(jq --raw-output '.state // empty' "$RUNNER_TEMP/jules-session-status.json")"
            if [ "$state" = 'COMPLETED' ]; then
              break
            fi
            if [ "$state" = 'FAILED' ]; then
              jq --raw-output '.url // empty' "$RUNNER_TEMP/jules-session-status.json" \
                > "$RUNNER_TEMP/jules-session-url.txt"
              exit 1
            fi
            sleep 15
          done

          [ "${state:-}" = 'COMPLETED' ]
          curl --fail-with-body --silent --show-error \
            --header "X-Goog-Api-Key: $JULES_API_KEY" \
            --output "$RUNNER_TEMP/jules-activities.json" \
            "https://jules.googleapis.com/v1alpha/sessions/$session_id/activities?pageSize=100"

          jq --raw-output '
            [
              .activities[]?
              | .agentMessaged.agentMessage?
              | select(type == "string" and startswith("<!-- JULES_PR_REVIEW -->"))
            ]
            | (last // empty)
            | sub("^<!-- JULES_PR_REVIEW -->\\r?\\n?"; "")
          ' "$RUNNER_TEMP/jules-activities.json" > "$RUNNER_TEMP/jules-review.md"

          test -s "$RUNNER_TEMP/jules-review.md"
          printf 'report_path=%s\n' "$RUNNER_TEMP/jules-review.md" >> "$GITHUB_OUTPUT"

      - name: Post Jules review
        if: steps.wait_for_review.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.resolve_context.outputs.pr_number }}
          REPORT_PATH: ${{ steps.wait_for_review.outputs.report_path }}
        run: |
          set -euo pipefail

          jq -n --rawfile body "$REPORT_PATH" '{body: $body, event: "COMMENT"}' \
            > "$RUNNER_TEMP/github-review-request.json"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data @"$RUNNER_TEMP/github-review-request.json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews"

      - name: Warn when pull request context is unavailable
        if: always() && steps.resolve_context.outcome != 'success'
        run: |
          echo '::warning::Jules review context could not be resolved. This is non-blocking.'

      - name: Warn when Jules review is unavailable
        if: always() && steps.resolve_context.outcome == 'success' && steps.create_session.outcome != 'success'
        run: |
          echo '::warning::Jules review session could not be created. This is non-blocking.'

      - name: Warn when Jules review is incomplete
        if: always() && steps.create_session.outcome == 'success' && steps.wait_for_review.outcome != 'success'
        env:
          SESSION_URL: ${{ steps.create_session.outputs.session_url }}
        run: |
          echo '::warning::Jules review did not complete or did not return a valid report. This is non-blocking.'
          if [ -n "$SESSION_URL" ]; then
            echo "Jules session: $SESSION_URL"
          fi
